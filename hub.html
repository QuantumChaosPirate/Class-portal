<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ms Kylie Buhagiar</title>
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<div class="crumb" id="crumb"></div>
<div class="page-title" id="title">Loading...</div>

<div id="buttons" style="display:flex; flex-direction:column; gap:12px;"></div>

<div style="margin-top:1.5rem;" id="back-wrap"></div>

<script src="js/config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const nodeKey = params.get("node") || "home";
  const node = CONFIG.NAV[nodeKey];

  if (!node) {
    document.getElementById("title").textContent = "Page not found";
  } else if (node.type === "dynamic") {
    document.title = node.title;
    document.getElementById("crumb").innerHTML = node.crumb || "";
    document.getElementById("title").textContent = node.title;
    document.getElementById("buttons").innerHTML = '<div class="loading">Loading...</div>';

    const parentFolderId = CONFIG.FOLDERS[node.folder];
    const url = `${CONFIG.DRIVE_LISTER_URL}?folderId=${parentFolderId}&type=folders`;

    fetch(url).then(res => res.json()).then(data => {
      if (data.error) {
        document.getElementById("buttons").innerHTML = `<div class="loading">Error: ${data.error}</div>`;
        return;
      }
      if (!data.files || data.files.length === 0) {
        document.getElementById("buttons").innerHTML = '<div class="loading">No folders here yet.</div>';
        return;
      }
      document.getElementById("buttons").innerHTML = data.files.map(f =>
        `<a class="btn" style="text-align:center; padding:14px; font-size:15px; font-weight:500;"
           href="page.html?folderId=${f.id}&title=${encodeURIComponent(f.name)}&crumb=${encodeURIComponent((node.crumb || "") + " &rsaquo; " + f.name)}">${f.name}</a>`
      ).join("");
    }).catch(() => {
      document.getElementById("buttons").innerHTML = '<div class="loading">Could not load folders.</div>';
    });

    document.getElementById("back-wrap").innerHTML = `<a class="btn" href="index.html">&larr; Home</a>`;
  } else {
    document.title = node.title;
    document.getElementById("crumb").innerHTML = node.crumb || "";
    document.getElementById("title").textContent = node.title;

    const targetFor = (childKey) => {
      const child = CONFIG.NAV[childKey];
      if (!child) return "#";
      if (child.type === "files") return `page.html?node=${childKey}`;
      if (child.type === "notice") return `noticeboard.html?node=${childKey}`;
      return `hub.html?node=${childKey}`;
    };

    document.getElementById("buttons").innerHTML = (node.children || []).map(childKey => {
      const child = CONFIG.NAV[childKey];
      const label = child ? child.title : childKey;
      return `<a class="btn" style="text-align:center; padding:14px; font-size:15px; font-weight:500;" href="${targetFor(childKey)}">${label}</a>`;
    }).join("");

    if (nodeKey !== "home") {
      document.getElementById("back-wrap").innerHTML =
        `<a class="btn" href="index.html">&larr; Home</a>`;
    }
  }
</script>
</body>
</html>
